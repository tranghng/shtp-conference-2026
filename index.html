function getSpeakerAvatarSvg(name) {
  const clean = (name || '').replace(/^(GS\.|TS\.|PGS\.|PROF\.|DR\.|ASSOC\.|MR\.|ÔNG|BÀ|LÃNH ĐẠO)\s*/gi, '').trim();
  const words = clean.split(/\s+/).filter(Boolean);
  let initials = 'SP';
  if (words.length >= 2) {
    initials = (words[0][0] + words[words.length - 1][0]).toUpperCase();
  } else if (words.length === 1) {
    initials = words[0].slice(0, 2).toUpperCase();
  }
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">' +
    '<defs><linearGradient id="g_' + initials + '" x1="0%" y1="0%" x2="100%" y2="100%">' +
    '<stop offset="0%" stop-color="#001f3f"/><stop offset="100%" stop-color="#0054a5"/>' +
    '</linearGradient></defs>' +
    '<rect width="200" height="200" fill="url(#g_' + initials + ')"/>' +
    '<circle cx="100" cy="72" r="36" fill="#ffcc00" opacity="0.95"/>' +
    '<path d="M42 175 C42 130 68 120 100 120 C132 120 158 130 158 175 Z" fill="#ffffff" opacity="0.85"/>' +
    '<text x="100" y="80" text-anchor="middle" fill="#001f3f" font-family="system-ui, sans-serif" font-weight="800" font-size="20">' + initials + '</text>' +
    '</svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

function shtpNoOrphan(t) {
  return String(t).split("\n").map(l => l.replace(/ (\S+)$/, "\u00A0$1")).join("\n");
}

// ==========================================
// 1. SHTP AGENDA SECTION COMPONENT
// ==========================================
function ShtpAgendaSection({ s, i, expandedSessions, toggleSession, toggleAllSessions }) {
  const allOpen = Object.values(expandedSessions).every(Boolean);

  return b.jsx("section", {
    id: "agenda",
    className: "py-24 bg-white",
    children: b.jsxs("div", {
      className: "max-w-7xl mx-auto px-4 md:px-6",
      children: [
        b.jsx(bi, { title: s.agenda.title, align: "center" }),

        // Morning Session Table
        b.jsx("div", {
          className: "overflow-x-auto shadow-2xl rounded-2xl border border-slate-100 mb-16",
          children: b.jsxs("table", {
            className: "w-full border-collapse",
            children: [
              b.jsx("thead", {
                children: b.jsxs("tr", {
                  className: "bg-shtp-dark text-white",
                  children: [
                    b.jsx("th", {
                      className: "p-5 text-left font-bold uppercase tracking-wider border-b border-slate-700 w-1/4 md:w-1/5 text-xs md:text-sm",
                      children: s.agenda.time
                    }),
                    b.jsx("th", {
                      className: "p-5 text-left font-bold uppercase tracking-wider border-b border-slate-700 w-3/4 md:w-4/5 text-xs md:text-sm",
                      children: s.agenda.content
                    })
                  ]
                })
              }),
              b.jsx("tbody", {
                children: s.agenda.morningItems.map((item, idx) => {
                  if (item.isSectionHeader) {
                    const rawTitle = item.title || "";
                    let badgeText = "";
                    let mainText = rawTitle;
                    if (rawTitle.includes(":")) {
                      const parts = rawTitle.split(":");
                      badgeText = parts[0].trim();
                      mainText = parts.slice(1).join(":").trim();
                    } else if (rawTitle.toUpperCase().startsWith("LỄ KHAI MẠC")) {
                      badgeText = "LỄ KHAI MẠC";
                      mainText = rawTitle.substring("LỄ KHAI MẠC".length).trim().replace(/^[-–—:]\s*/, "");
                    } else if (rawTitle.toUpperCase().startsWith("OPENING CEREMONY")) {
                      badgeText = "OPENING CEREMONY";
                      mainText = rawTitle.substring("OPENING CEREMONY".length).trim().replace(/^[-–—:]\s*/, "");
                      if (mainText.toUpperCase().startsWith("OF ")) {
                        mainText = mainText.substring(3).trim();
                      }
                    }

                    return b.jsx("tr", {
                      style: { backgroundColor: "#071938" },
                      children: b.jsx("td", {
                        colSpan: 2,
                        style: {
                          background: "linear-gradient(90deg, #001f3f 0%, #003366 60%, #001f3f 100%)",
                          borderLeft: "5px solid #ffcc00",
                          borderTop: "1px solid #1a3a6e",
                          borderBottom: "1px solid #1a3a6e",
                          padding: "14px 20px"
                        },
                        children: b.jsxs("div", {
                          className: "flex items-center justify-between gap-3 flex-wrap",
                          children: [
                            b.jsxs("div", {
                              className: "flex items-center gap-3 flex-wrap",
                              children: [
                                badgeText ? b.jsxs("span", {
                                  style: {
                                    background: "#ffcc00",
                                    color: "#001f3f",
                                    fontWeight: "800",
                                    fontSize: "11px",
                                    padding: "4px 10px",
                                    borderRadius: "6px",
                                    letterSpacing: "0.05em",
                                    textTransform: "uppercase",
                                    whiteSpace: "nowrap",
                                    display: "inline-flex",
                                    alignItems: "center",
                                    gap: "6px",
                                    boxShadow: "0 2px 6px rgba(255, 204, 0, 0.3)"
                                  },
                                  children: [
                                    b.jsx("span", {
                                      style: {
                                        width: "6px",
                                        height: "6px",
                                        borderRadius: "50%",
                                        backgroundColor: "#071938",
                                        display: "inline-block"
                                      }
                                    }),
                                    badgeText
                                  ]
                                }) : b.jsx("span", {
                                  style: {
                                    width: "10px",
                                    height: "10px",
                                    borderRadius: "50%",
                                    backgroundColor: "#ffcc00",
                                    boxShadow: "0 0 10px #ffcc00",
                                    flexShrink: 0,
                                    display: "inline-block"
                                  }
                                }),
                                b.jsx("span", {
                                  style: {
                                    color: "#ffffff",
                                    fontWeight: "800",
                                    fontSize: "14px",
                                    letterSpacing: "0.025em",
                                    textTransform: "uppercase",
                                    textShadow: "0 1px 3px rgba(0, 0, 0, 0.6)"
                                  },
                                  children: mainText
                                })
                              ]
                            }),
                            (item.hall || item.location) && b.jsxs("div", {
                              className: "inline-flex items-center gap-2 bg-white/10 hover:bg-white/15 backdrop-blur-sm border border-white/20 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold tracking-wide shadow-xs transition-colors shrink-0",
                              children: [
                                b.jsx("svg", {
                                  className: "w-3.5 h-3.5 text-[#ffcc00] shrink-0",
                                  viewBox: "0 0 24 24",
                                  fill: "currentColor",
                                  children: b.jsx("path", {
                                    d: "M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"
                                  })
                                }),
                                b.jsx("strong", {
                                  className: "text-[#ffcc00] font-bold",
                                  children: item.hall || item.location
                                })
                              ]
                            })
                          ]
                        })
                      })
                    }, "header-" + idx);
                  }

                  if (item.isBreak) {
                    return b.jsx("tr", {
                      className: "bg-amber-50/70 border-y-2 border-amber-200 text-amber-900",
                      children: [
                        b.jsx("td", {
                          className: "p-5 border-b border-amber-200 font-bold text-amber-800 whitespace-nowrap",
                          children: b.jsxs("div", {
                            className: "flex items-center gap-2",
                            children: [b.jsx(vp, { size: 16 }), item.time]
                          })
                        }),
                        b.jsx("td", {
                          className: "p-5 border-b border-amber-200 font-bold text-sm md:text-base text-amber-900",

// KHOẢNH KHẮC SỰ KIỆN: video recap + banner ảnh tự động (đọc ảnh từ images/events)
// ==========================================
const SHTP_EVENTS_DIR = "images/events/";
const SHTP_IMG_RE = /\.(jpe?g|png|webp|gif|avif)$/i;

function shtpGithubRepo() {
  try {
    const h = window.location.hostname;
    if (h.endsWith(".github.io")) {
      const owner = h.split(".")[0];
      const repo = window.location.pathname.split("/").filter(Boolean)[0];
      if (owner && repo) return owner + "/" + repo;
    }
  } catch (e) {}
  return "tranghng/shtp-conference-2026";
}

function shtpVideoEmbed(url) {
  if (!url) return null;
  const u = String(url).trim();
  let m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/i);
  if (m) return { type: "iframe", src: "https://www.youtube.com/embed/" + m[1] + "?rel=0" };
  if (/facebook\.com|fb\.watch/i.test(u)) return { type: "iframe", src: "https://www.facebook.com/plugins/video.php?show_text=false&href=" + encodeURIComponent(u) };
  if (/\.(mp4|webm|ogg)(\?.*)?$/i.test(u)) return { type: "video", src: /^https?:/i.test(u) ? u : (u.indexOf("/") === -1 ? SHTP_EVENTS_DIR + u : u) };
  return { type: "iframe", src: u };
}

function ShtpMomentsSection({ i }) {
  const [images, setImages] = q.useState([]);
  const [cfg, setCfg] = q.useState({});
  const [idx, setIdx] = q.useState(0);
  const [paused, setPaused] = q.useState(false);
  const vi = i === "vi";
  const title = vi ? "KHOẢNH KHẮC SỰ KIỆN" : "EVENT MOMENTS";

  q.useEffect(() => {
    let dead = false;
    const natural = (a, c) => a.localeCompare(c, undefined, { numeric: true, sensitivity: "base" });
    const done = (list, conf) => { if (!dead) { setImages(list); setCfg(conf || {}); } };
    const fromCfg = (conf) => (conf.images || []).filter(n => SHTP_IMG_RE.test(n)).map(n => /^(https?:|images\/)/i.test(n) ? n : SHTP_EVENTS_DIR + n);
    fetch(SHTP_EVENTS_DIR + "config.json?v=" + Date.now()).then(r => r.ok ? r.json() : {}).catch(() => ({})).then(conf => {
      // 1) Tự động đọc danh sách file trong thư mục images/events qua GitHub API
      fetch("https://api.github.com/repos/" + shtpGithubRepo() + "/contents/images/events")
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(files => {
          const list = files.filter(f => f.type === "file" && SHTP_IMG_RE.test(f.name)).map(f => f.name).sort(natural).map(n => SHTP_EVENTS_DIR + n);
          if (list.length) done(list, conf); else done(fromCfg(conf), conf);
        })
        // 2) Dự phòng: danh sách "images" trong config.json
        .catch(() => done(fromCfg(conf), conf));
    });
    return () => { dead = true; };
  }, []);

  const n = images.length;
  q.useEffect(() => {
    if (n < 2 || paused) return;
    const t = setInterval(() => setIdx(x => (x + 1) % n), 4500);
    return () => clearInterval(t);
  }, [n, paused]);
  q.useEffect(() => { if (n > 1) { const im = new Image(); im.src = images[(idx + 1) % n]; } }, [idx, n]);

  const go = (k) => setIdx(((k % n) + n) % n);
  const video = shtpVideoEmbed(cfg.video);
  const nextCount = Math.min(4, Math.max(0, n - 1));
  const nexts = [];
  for (let k = 1; k <= nextCount; k++) nexts.push((idx + k) % n);

  const videoBox = video
    ? (video.type === "video"
        ? b.jsx("video", { className: "moments-video", src: video.src, poster: cfg.poster ? (/^(https?:|images\/)/i.test(cfg.poster) ? cfg.poster : SHTP_EVENTS_DIR + cfg.poster) : undefined, controls: true, playsInline: true, preload: "metadata" })
        : b.jsx("iframe", { className: "moments-video", src: video.src, title: "Video", allow: "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen", allowFullScreen: true, loading: "lazy" }))
    : b.jsxs("div", { className: "moments-video moments-video-empty", children: [
        b.jsx("div", { className: "moments-play", children: b.jsx("svg", { width: 34, height: 34, viewBox: "0 0 24 24", fill: "currentColor", children: b.jsx("path", { d: "M8 5v14l11-7z" }) }) }),
        b.jsx("div", { className: "moments-empty-title", children: "Video" }),
        b.jsx("div", { className: "moments-empty-sub", children: vi ? "Sắp được cập nhật" : "Coming soon" })
      ] });

  return b.jsx("section", {
    id: "gallery",
    className: "py-20 bg-slate-50 overflow-hidden",
    children: b.jsxs("div", { className: "max-w-7xl mx-auto px-6", children: [
      b.jsx(bi, { title: title }),
      b.jsxs("div", { className: "moments-grid", children: [
        // Cột trái: video recap

/* Hero backdrop */
.shtp-hero{position:relative;background:#eaf7ff;overflow:hidden;}
.shtp-hero-img{display:block;width:100%;height:auto;}
.shtp-hero-cta{position:absolute;left:0;right:0;bottom:12%;display:flex;justify-content:center;gap:1.25rem;flex-wrap:wrap;z-index:2;padding:0 1rem;}
@media (max-width:767px){.shtp-hero{padding-top:3.5rem;}.shtp-hero-cta{position:static;flex-direction:column;padding:1rem 1rem 1.5rem;background:#eaf7ff;}}
/* Hero edition line: keep "NĂM 2026" on one line */
.shtp-edition-vi{display:inline-block;white-space:nowrap;font-size:clamp(1.05rem,3.7vw,3.2rem);}
.speaker-card-5 p{text-wrap:balance;}

/* ===== Khoảnh khắc sự kiện ===== */
.moments-grid{display:grid;grid-template-columns:1fr;gap:28px;margin-top:8px}
@media(min-width:1024px){.moments-grid{grid-template-columns:5fr 7fr;gap:32px;align-items:start}}
.moments-label{font-size:12px;font-weight:800;letter-spacing:.14em;color:#0b5cab;margin:0 0 10px}
.moments-video-wrap{position:relative;width:100%;aspect-ratio:16/10;border-radius:18px;overflow:hidden;background:#0b1b33;box-shadow:0 10px 30px rgba(11,27,51,.18)}
.moments-video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.moments-video-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;background:linear-gradient(135deg,#0b2a55 0%,#0ca1fb 100%)}
.moments-play{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;padding-left:4px}
.moments-empty-title{font-weight:800;font-size:18px;letter-spacing:.04em}
.moments-empty-sub{font-size:13px;opacity:.85}
.moments-big{position:relative;width:100%;aspect-ratio:16/10;border-radius:18px;overflow:hidden;background:#dbe5f1;box-shadow:0 10px 30px rgba(11,27,51,.18)}
.moments-big-empty{display:flex;align-items:center;justify-content:center;color:#64748b;font-weight:600}
.moments-big-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:momentsFade .9s ease}
@keyframes momentsFade{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:scale(1)}}
.moments-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#0b2a55;font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.moments-big:hover .moments-nav{opacity:1}
.moments-prev{left:12px}.moments-next{right:12px}
.moments-count{position:absolute;right:12px;bottom:12px;background:rgba(11,27,51,.65);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.06em}
.moments-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.moments-thumb{position:relative;aspect-ratio:16/10;border:0;padding:0;border-radius:12px;overflow:hidden;cursor:pointer;background:#dbe5f1;opacity:.85;transition:opacity .2s,transform .2s;animation:momentsThumb .6s ease both}
.moments-thumb:hover{opacity:1;transform:translateY(-2px)}
.moments-thumb img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes momentsThumb{from{opacity:0;transform:translateX(24px)}to{opacity:.85;transform:translateX(0)}}


/* ===== Báo chí đưa tin ===== */
.press-block{margin-top:44px;padding-top:30px;border-top:1px solid #e2e8f0}
.press-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.press-title{font-size:15px;font-weight:800;letter-spacing:.14em;color:#0b2a55;margin:0}
.press-count{font-size:12px;color:#64748b;font-weight:600}
.press-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:768px){.press-grid{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.press-grid{grid-template-columns:repeat(3,1fr)}}
.press-card{display:flex;gap:12px;align-items:stretch;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:10px;text-decoration:none;transition:box-shadow .2s,transform .2s,border-color .2s}
.press-card:hover{box-shadow:0 8px 22px rgba(11,42,85,.12);transform:translateY(-2px);border-color:#0ca1fb}
.press-thumb{flex:0 0 104px;height:78px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#0b2a55,#0ca1fb);display:flex;align-items:center;justify-content:center}
.press-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.press-thumb-letter{color:#fff;font-weight:800;font-size:26px;opacity:.9}
.press-body{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px}
.press-meta{display:flex;gap:8px;align-items:center;font-size:11px;font-weight:700}
.press-source{color:#0b5cab;text-transform:uppercase;letter-spacing:.04em}
.press-date{color:#94a3b8;font-weight:600}
.press-card-title{font-size:13.5px;line-height:1.38;font-weight:700;color:#0f172a;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.press-more-wrap{text-align:center;margin-top:18px}
.press-more{border:1.5px solid #0b5cab;color:#0b5cab;background:#fff;font-weight:700;font-size:13px;padding:9px 22px;border-radius:999px;cursor:pointer;transition:all .2s}
.press-more:hover{background:#0b5cab;color:#fff}

/* Gallery Carousel Dots */
html, body {
  overflow-x: hidden !important;
  max-width: 100vw !important;
  width: 100% !important;
}
.gallery-dots {
  display: flex !important;
  justify-content: center !important;
  align-items: center !important;
  flex-wrap: wrap !important;
  max-width: 100% !important;
  padding: 8px 12px !important;
  gap: 6px !important;
}
.gallery-dots::-webkit-scrollbar {
  display: none !important;
}
.gallery-dot {
  width: 8px !important;
  height: 8px !important;
  min-width: 8px !important;
  min-height: 8px !important;
  max-width: 8px !important;
  max-height: 8px !important;
  border-radius: 9999px !important;
  padding: 0 !important;
  border: none !important;
  outline: none !important;
  cursor: pointer !important;
  flex-shrink: 0 !important;
  transition: all 0.3s ease !important;
}
.gallery-dot-active {
  width: 24px !important;
  min-width: 24px !important;
  max-width: 24px !important;
  height: 8px !important;
  min-height: 8px !important;
  max-height: 8px !important;
  border-radius: 9999px !important;
  background-color: #0054a5 !important;
}

.bg-emerald-600 { background-color: #059669 !important; }

/* Agenda Clock Icon Styles & Hover Effect */
.agenda-clock-icon {
  background-color: rgba(0, 84, 165, 0.1) !important;
  color: #0054a5 !important;
  transition: all 0.2s ease-in-out !important;
}

.agenda-clock-icon svg {
  color: #0054a5 !important;
  stroke: #0054a5 !important;
  transition: stroke 0.2s ease-in-out, color 0.2s ease-in-out !important;
}

tr:hover .agenda-clock-icon,
tr.group:hover .agenda-clock-icon,
.agenda-clock-icon:hover {
  background-color: #0054a5 !important;
  color: #ffffff !important;
}

tr:hover .agenda-clock-icon svg,
tr.group:hover .agenda-clock-icon svg,
.agenda-clock-icon:hover svg,
.group:hover .group-hover\:text-white svg {
  color: #ffffff !important;
  stroke: #ffffff !important;
}

/* Gaps */
.gap-1\.5 { gap: 0.375rem !important; }
.gap-2 { gap: 0.5rem !important; }
.gap-3 { gap: 0.75rem !important; }
.gap-4 { gap: 1rem !important; }

.topic-number-badge {
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  width: 20px !important;
  height: 20px !important;
  min-width: 20px !important;
  min-height: 20px !important;
  border-radius: 50% !important;
  background-color: #ffcc00 !important;
  color: #001f3f !important;
  font-size: 11px !important;
  font-weight: 800 !important;
  text-align: center !important;
  line-height: 20px !important;
}
